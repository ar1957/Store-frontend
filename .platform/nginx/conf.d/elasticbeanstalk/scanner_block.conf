# Drop scanner/bot paths before they reach Next.js
# Use 404, not 444: 444 drops the connection with no response, which the
# load balancer turns into a 502 and counts as a 5xx error in EB health.
location ~* ^/(\.env|\.git|wp-admin|wp-login|phpmyadmin|xmlrpc\.php|\.aws|actuator|admin\.php|shell|config\.php) {
  return 404;
}
location ~ /\.\. {
  return 404;
}

# Block by file extension (backup files, certs, config dumps)
location ~* \.(bak|old|tmp|swp|save|orig|backup|lz4|xz|sql|inc|pem|p12|crt|key|cfg|ini|properties|log)$ {
  return 404;
}

# Block vim/emacs backup suffixes (~)
location ~* ~$ {
  return 404;
}

# Increase body buffer to avoid disk-buffering large checkout POSTs
client_body_buffer_size 256k;
